name: Apply and verify documentary frame patches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-frame-patches.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cedwyn-movie-frame-projection
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the movie source with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply chronology and fold plans to the generated projection
        run: |
          set -euo pipefail
          python3 tools/script_patch.py --apply
          python3 tools/script_fold.py --apply
          python3 tools/script_patch.py --check

      - name: Verify the exact owner-approved v5.0.1 projection
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          p = pathlib.Path("frames.json")
          raw = p.read_bytes()
          data = json.loads(raw)
          actual = hashlib.sha256(raw).hexdigest()
          expected = "1ed6e6334b12567c9c1316d64dcc75ea62f92cad66869c187af919e9f769336a"
          checks = {
              "version": data.get("version") == "5.0.1",
              "active": len(data.get("items", [])) == 127,
              "folded": len(data.get("folded", [])) == 132,
              "appendix": len(data.get("appendix", [])) == 55,
              "unique_ids": len({x.get("id") for group in (data.get("items", []) + data.get("folded", []) + data.get("appendix", [])) for x in [group]}) == 314,
              "sha256": actual == expected,
          }
          print(json.dumps({"checks": checks, "sha256": actual, "bytes": len(raw)}, indent=2))
          if not all(checks.values()):
              raise SystemExit("Frame projection did not meet the v5.0.1 acceptance values.")
          PY

      - name: Commit the generated projection only when it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- frames.json; then
            echo "frames.json already matches the approved projection; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frames.json
          git commit -m "frames.json v5.0.1: apply reviewed script and fold patches"
          git push origin HEAD:main
